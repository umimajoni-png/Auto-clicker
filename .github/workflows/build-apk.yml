name: Build TapFlow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source ZIP
        run: |
          cat source.part1.b64 source.part2.b64 source.part3.b64 source.part4.b64 source.part5.b64 > source.b64
          base64 -d source.b64 > TapFlow-source.zip
          mkdir project
          unzip -q TapFlow-source.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate wrapper and build
        working-directory: project
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Unit tests
        working-directory: project
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TapFlow-AutoClicker-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
