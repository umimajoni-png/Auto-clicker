name: Build TapFlow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source ZIP
        run: |
          cat source.part1.b64 source.part2.b64 source.part3.b64 source.part4.b64 source.part5.b64 > source.b64
          base64 -d source.b64 > TapFlow-source.zip
          mkdir project
          unzip -q TapFlow-source.zip -d project

      - name: Patch known Kotlin compile issues
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project/app/src/main/java/com/tapflow/autoclicker/MainActivity.kt')
          s=p.read_text()
          s=s.replace('import androidx.compose.ui.layout.localToWindow','import androidx.compose.ui.layout.positionInWindow')
          s=s.replace('q.localToWindow(androidx.compose.ui.geometry.Offset.Zero)','q.positionInWindow()')
          old='@Composable fun AppNav(){var screen by remember{mutableStateOf("home")};var onboard by remember{mutableStateOf(!LocalContext.current.getSharedPreferences("tf",0).getBoolean("onboard",false))};if(onboard){Onboarding{LocalContext.current.getSharedPreferences("tf",0).edit().putBoolean("onboard",true).apply();onboard=false};return};when(screen){"benchmark"->Benchmark{screen="home"};"settings"->SettingsScreen{screen="home"};"profiles"->Profiles{screen="home"};else->Home{screen=it}}}'
          new='''@Composable fun AppNav(){
           val context=LocalContext.current
           val prefs=remember(context){context.getSharedPreferences("tf",0)}
           var screen by remember{mutableStateOf("home")}
           var onboard by remember{mutableStateOf(!prefs.getBoolean("onboard",false))}
           if(onboard){Onboarding{prefs.edit().putBoolean("onboard",true).apply();onboard=false};return}
           when(screen){"benchmark"->Benchmark{screen="home"};"settings"->SettingsScreen{screen="home"};"profiles"->Profiles{screen="home"};else->Home{screen=it}}
          }'''
          if old not in s:
              raise SystemExit('AppNav pattern not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate wrapper and build
        working-directory: project
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Unit tests
        working-directory: project
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TapFlow-AutoClicker-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
